operations:
  rsync:
    arguments: ["-al", "--no-perms", "--chmod=ugo=rwX", "-O", "--min-size=1",
                    "--include", "'*/'",

                    # EBS
                    "--include", "'A*osscounterfile_CUCP*.xml.gz'",
                    "--include", "'A*osscounterfile_CUUP*.xml.gz'",
                    "--include", "'A*osscounterfile_DU*.xml.gz'",

                    "--exclude", "'*'",
                    "--prune-empty-dirs"]

    src: "{{source_path}}"
    dest: "{{dest_path}}/{{ip_omc}}/{{date}}"
    sshpass: true

parameters:
  SOURCE_TYPE: "${SOURCE_TYPE}"
  SOURCE_DOMAIN: "${SOURCE_DOMAIN}"
  SOURCE_SUBDOMAIN: "${SOURCE_SUBDOMAIN}"
  MODEL: "${MODEL}"
  VENDOR: "${VENDOR}"
  LABEL: "${LABEL}"
  FUNCTION: "${FUNCTION}"
  SPEC: "${SPEC}"
  OSSVERSION: "${OSSVERSION}"
  PERIOD: ${PERIOD}
  HOST_ID: "${HOST_ID}"
